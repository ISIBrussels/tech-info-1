<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz — Séance 3</title>
    <style>
      :root {
        --color-primary: #0075c9;
        --color-secondary: #757575;
        --color-bg: #ffffff;
        --color-text: #212121;
        --color-border: #e0e0e0;
        --color-row-alt: #f5f5f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: 920px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 3rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.65;
        color: var(--color-text);
        background: var(--color-bg);
      }

      h1 {
        margin: 0 0 1.25rem;
        font-size: 1.85rem;
        font-weight: 700;
        color: var(--color-primary);
        padding-bottom: 0.6rem;
        border-bottom: 2px solid var(--color-primary);
      }

      h2 {
        margin: 0 0 0.75rem;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--color-secondary);
      }

      a {
        color: var(--color-primary);
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        text-decoration: underline;
      }

      .page-nav {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin: 0 0 1.25rem;
      }

      .page-nav a {
        display: inline-block;
        padding: 0.3rem 0.7rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-primary);
        text-decoration: none;
        background: transparent;
        border: 1px solid var(--color-primary);
      }

      .page-nav a:hover {
        background: var(--color-primary);
        color: #fff;
        text-decoration: none;
      }

      .progress {
        margin: 0 0 1rem;
        font-size: 0.95rem;
        color: var(--color-secondary);
      }

      .question {
        border: 1px solid var(--color-border);
        padding: 1rem;
        margin-top: 1rem;
        background: var(--color-bg);
      }

      .answers {
        display: grid;
        gap: 0;
        margin: 1rem 0 0;
        border: 1px solid var(--color-border);
      }

      .answers label {
        display: block;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--color-border);
        cursor: pointer;
      }

      .answers label:last-child {
        border-bottom: none;
      }

      .answers label:nth-child(even) {
        background: var(--color-row-alt);
      }

      .answers label.correct {
        background: var(--color-row-alt);
        color: var(--color-primary);
        font-weight: 600;
      }

      .answers label.wrong {
        color: var(--color-secondary);
        text-decoration: line-through;
      }

      .answers label.checked-mode {
        cursor: default;
      }

      .option-tag {
        display: inline-block;
        margin-left: 0.35rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-secondary);
      }

      button {
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--color-primary);
        background: transparent;
        color: var(--color-primary);
        font-weight: 600;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--color-primary);
        color: #fff;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1.25rem;
      }

      #reset-btn {
        margin-left: auto;
      }

      .result {
        font-weight: 600;
        margin-top: 1rem;
      }

      .ok {
        color: var(--color-primary);
      }

      .ko {
        color: var(--color-secondary);
      }

      .muted {
        color: var(--color-secondary);
      }

      .question-feedback {
        margin-top: 0.75rem;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .status {
        margin-top: 0.75rem;
        font-size: 0.95rem;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88em;
        background: var(--color-row-alt);
        color: var(--color-secondary);
        padding: 0.1em 0.35em;
      }

      .site-footer {
        margin-top: 2.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--color-border);
        text-align: center;
        font-size: 0.9rem;
        color: var(--color-secondary);
      }

      .site-footer a {
        color: var(--color-secondary);
        text-decoration: underline;
        font-weight: 400;
      }

      .site-footer a:hover {
        color: var(--color-primary);
      }
    </style>
  </head>
  <body>
    <h1>Quiz — Séance 3</h1>
    <nav class="page-nav">
      <a href="../../index.html">← Retour à l'accueil</a>
      <a href="cours_seance_03.html">Retour aux slides</a>
    </nav>
    <p class="muted">10 questions sur le cours de la séance 3.</p>
    <p class="progress" id="progress"></p>
    <div id="quiz"></div>

    <div class="actions">
      <button id="check-btn" type="button">Valider les réponses</button>
      <button id="reset-btn" type="button">Réinitialiser</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div id="summary" class="result" aria-live="polite"></div>

    <script>
      const storageKey = "quiz_seance_03_answers_v4";
      const checkedKey = "quiz_seance_03_checked_v4";

      const questions = [
        {
          id: "q1",
          text: "Que se passe-t-il si, dans un <code>while n &lt; 10</code>, on oublie <code>n += 1</code> ?",
          options: [
            { value: "A", label: "la boucle ne s'exécute jamais" },
            { value: "B", label: "on obtient une boucle infinie" },
            { value: "C", label: "Python incrémente <code>n</code> automatiquement" },
            { value: "D", label: "le script s'arrête après 10 itérations par défaut" },
          ],
          correct: "B",
          feedback: "Sans faire évoluer la condition, elle reste <code>True</code> : la boucle ne s'arrête pas.",
        },
        {
          id: "q2",
          text: "Dans une séquence Python, le premier élément a l'indice…",
          options: [
            { value: "A", label: "<code>1</code>" },
            { value: "B", label: "<code>-1</code>" },
            { value: "C", label: "<code>0</code>" },
            { value: "D", label: "<code>None</code>" },
          ],
          correct: "C",
          feedback: "On commence à compter à partir de 0. C'est valable pour <code>str</code>, <code>list</code> et <code>tuple</code>.",
        },
        {
          id: "q3",
          text: "Pour une liste <code>mixed_values</code>, que désigne <code>mixed_values[2:7]</code> ?",
          options: [
            { value: "A", label: "les éléments d'indices 2 à 7 inclus" },
            { value: "B", label: "les éléments d'indices 2 à 6 (borne de fin exclue)" },
            { value: "C", label: "uniquement l'élément d'indice 2, répété 7 fois" },
            { value: "D", label: "les 7 premiers éléments" },
          ],
          correct: "B",
          feedback: "En slicing, la borne de fin est exclue : on va de l'indice 2 jusqu'à l'indice 6.",
        },
        {
          id: "q4",
          text: "Que désigne <code>mixed_values[-2]</code> ?",
          options: [
            { value: "A", label: "le deuxième élément" },
            { value: "B", label: "l'avant-dernier élément" },
            { value: "C", label: "une erreur, les indices négatifs sont interdits" },
            { value: "D", label: "une copie des deux derniers éléments" },
          ],
          correct: "B",
          feedback: "Un indice négatif compte depuis la fin : <code>-1</code> est le dernier, <code>-2</code> l'avant-dernier.",
        },
        {
          id: "q5",
          text: "Quelle méthode ajoute un objet à la fin d'une liste ?",
          options: [
            { value: "A", label: "<code>insert()</code>" },
            { value: "B", label: "<code>extend()</code>" },
            { value: "C", label: "<code>append()</code>" },
            { value: "D", label: "<code>pop()</code>" },
          ],
          correct: "C",
          feedback: "<code>append</code> ajoute à la fin, <code>insert</code> à un indice, <code>extend</code> concatène une autre liste.",
        },
        {
          id: "q6",
          text: "Pourquoi écrit-on <code>mixed_values.append(...)</code> plutôt que <code>append(mixed_values, ...)</code> ?",
          options: [
            { value: "A", label: "parce que <code>append</code> est une méthode d'instance : elle opère sur l'objet" },
            { value: "B", label: "parce que <code>append</code> est une fonction built-in comme <code>print</code>" },
            { value: "C", label: "parce que Python interdit les fonctions à plusieurs arguments" },
            { value: "D", label: "parce que <code>append</code> ne fonctionne que dans un <code>while</code>" },
          ],
          correct: "A",
          feedback: "Une méthode s'appelle sur l'objet (<code>variable.methode()</code>). <code>print()</code> et <code>input()</code> sont des fonctions.",
        },
        {
          id: "q7",
          text: "Quelle différence entre <code>copied = values.copy()</code> et <code>alias = values</code> ?",
          options: [
            { value: "A", label: "aucune : les deux créent une nouvelle liste" },
            { value: "B", label: "<code>copy()</code> crée une nouvelle liste ; l'alias désigne le même objet" },
            { value: "C", label: "l'alias crée une nouvelle liste ; <code>copy()</code> partage le même objet" },
            { value: "D", label: "<code>copy()</code> transforme la liste en tuple" },
          ],
          correct: "B",
          feedback: "<code>id(copied)</code> est différent de <code>id(values)</code> ; <code>id(alias)</code> est identique.",
        },
        {
          id: "q8",
          text: "Quelle affirmation est vraie pour un <code>tuple</code> ?",
          options: [
            { value: "A", label: "on peut y ajouter des éléments avec <code>append</code>" },
            { value: "B", label: "on peut modifier un élément par indice" },
            { value: "C", label: "on ne peut ni modifier, ni ajouter, ni retirer d'éléments" },
            { value: "D", label: "il n'a pas d'indices, contrairement à une liste" },
          ],
          correct: "C",
          feedback: "Un tuple est immuable. On peut lire un élément (<code>sample_tuple[3]</code>), pas le changer.",
        },
        {
          id: "q9",
          text: "Que produit <code>range(10)</code> ?",
          options: [
            { value: "A", label: "les entiers de 1 à 10 inclus" },
            { value: "B", label: "les entiers de 0 à 10 inclus" },
            { value: "C", label: "les entiers de 0 à 9 (10 exclu), pas de 1" },
            { value: "D", label: "une liste vide de longueur 10" },
          ],
          correct: "C",
          feedback: "<code>range(10)</code> va de 0 à 10 exclu, avec un pas de 1.",
        },
        {
          id: "q10",
          text: "Si <code>matrix = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]</code>, que vaut <code>matrix[0][2]</code> ?",
          options: [
            { value: "A", label: "<code>1</code>" },
            { value: "B", label: "<code>3</code>" },
            { value: "C", label: "<code>7</code>" },
            { value: "D", label: "<code>[1, 2, 3]</code>" },
          ],
          correct: "B",
          feedback: "<code>matrix[0]</code> est la première ligne <code>[1, 2, 3]</code> ; l'indice 2 de cette ligne est <code>3</code>.",
        },
      ];

      const quizEl = document.getElementById("quiz");
      const progressEl = document.getElementById("progress");
      const statusEl = document.getElementById("status");
      const summaryEl = document.getElementById("summary");
      const checkBtn = document.getElementById("check-btn");
      const resetBtn = document.getElementById("reset-btn");

      let checked = false;
      const answers = {};

      function loadState() {
        const rawAnswers = localStorage.getItem(storageKey);
        const rawChecked = localStorage.getItem(checkedKey);

        if (rawAnswers) {
          try {
            Object.assign(answers, JSON.parse(rawAnswers));
          } catch {
            localStorage.removeItem(storageKey);
          }
        }

        checked = rawChecked === "1";
      }

      function saveState() {
        localStorage.setItem(storageKey, JSON.stringify(answers));
        localStorage.setItem(checkedKey, checked ? "1" : "0");
      }

      function answeredCount() {
        return questions.filter((question) => answers[question.id]).length;
      }

      function updateProgress() {
        progressEl.textContent = `${answeredCount()} / ${questions.length} réponse(s) cochée(s)`;
      }

      function renderQuiz() {
        quizEl.innerHTML = questions
          .map((question, index) => {
            const selected = answers[question.id] || null;
            let feedbackHtml = "";

            if (checked) {
              const isCorrect = selected === question.correct;
              const verdictClass = !selected ? "ko" : isCorrect ? "ok" : "ko";
              const verdictText = !selected
                ? "Non répondue."
                : isCorrect
                  ? `Correct. ${question.feedback}`
                  : `Incorrect. ${question.feedback}`;
              feedbackHtml = `<p class="question-feedback ${verdictClass}">${verdictText}</p>`;
            }

            const optionsHtml = question.options
              .map((option) => {
                const isCorrect = option.value === question.correct;
                const isChosen = option.value === selected;
                const classes = [];
                if (checked) classes.push("checked-mode");
                if (checked && isCorrect) classes.push("correct");
                if (checked && isChosen && !isCorrect) classes.push("wrong");

                let tag = "";
                if (checked && isCorrect) tag = '<span class="option-tag">bonne réponse</span>';
                else if (checked && isChosen) tag = '<span class="option-tag">réponse sélectionnée</span>';

                return `
                  <label class="${classes.join(" ")}">
                    <input
                      type="radio"
                      name="${question.id}"
                      value="${option.value}"
                      ${selected === option.value ? "checked" : ""}
                      ${checked ? "disabled" : ""}
                    />
                    ${option.value}. ${option.label}${tag}
                  </label>
                `;
              })
              .join("");

            return `
              <section class="question" data-question-id="${question.id}">
                <h2>Question ${index + 1}</h2>
                <p><strong>${question.text}</strong></p>
                <div class="answers">${optionsHtml}</div>
                ${feedbackHtml}
              </section>
            `;
          })
          .join("");

        if (!checked) {
          quizEl.querySelectorAll('input[type="radio"]').forEach((input) => {
            input.addEventListener("change", () => {
              answers[input.name] = input.value;
              statusEl.textContent = "";
              statusEl.className = "status";
              summaryEl.innerHTML = "";
              summaryEl.className = "result";
              saveState();
              updateProgress();
            });
          });
        }

        checkBtn.hidden = checked;
        updateProgress();

        if (checked) {
          renderSummary();
        } else {
          summaryEl.innerHTML = "";
          summaryEl.className = "result";
        }
      }

      function renderSummary() {
        let score = 0;
        questions.forEach((question) => {
          if (answers[question.id] === question.correct) score += 1;
        });

        summaryEl.innerHTML = `<p class="${score === questions.length ? "ok" : "ko"}">Score : ${score} / ${questions.length}</p>`;
        summaryEl.className = "result";
      }

      function checkAll() {
        const unanswered = questions.filter((question) => !answers[question.id]);
        if (unanswered.length > 0) {
          statusEl.textContent = `Il reste ${unanswered.length} question(s) sans réponse.`;
          statusEl.className = "status ko";
          const firstMissing = quizEl.querySelector(
            `[data-question-id="${unanswered[0].id}"]`
          );
          if (firstMissing) firstMissing.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }

        checked = true;
        statusEl.textContent = "";
        statusEl.className = "status";
        saveState();
        renderQuiz();
        summaryEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function resetQuiz() {
        for (const key of Object.keys(answers)) {
          delete answers[key];
        }
        checked = false;
        localStorage.removeItem(storageKey);
        localStorage.removeItem(checkedKey);
        statusEl.textContent = "";
        statusEl.className = "status";
        summaryEl.innerHTML = "";
        summaryEl.className = "result";
        renderQuiz();
      }

      checkBtn.addEventListener("click", checkAll);
      resetBtn.addEventListener("click", resetQuiz);

      loadState();
      renderQuiz();
    </script>

    <footer class="site-footer"><a href="mailto:shuraux@he2b.be">Sylvain Huraux - HE2B - ISIB</a></footer>
  </body>
</html>
