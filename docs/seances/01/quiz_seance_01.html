<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz — Séance 1</title>
    <style>
      :root {
        --color-primary: #0075c9;
        --color-secondary: #757575;
        --color-bg: #ffffff;
        --color-text: #212121;
        --color-border: #e0e0e0;
        --color-row-alt: #f5f5f5;
        --color-error: #f23646;
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: 920px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 3rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.65;
        color: var(--color-text);
        background: var(--color-bg);
      }

      h1 {
        margin: 0 0 1.25rem;
        font-size: 1.85rem;
        font-weight: 700;
        color: var(--color-primary);
        padding-bottom: 0.6rem;
        border-bottom: 2px solid var(--color-primary);
      }

      h2 {
        margin: 0 0 0.75rem;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--color-secondary);
      }

      a {
        color: var(--color-primary);
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        text-decoration: underline;
      }

      .page-nav {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin: 0 0 1.25rem;
      }

      .page-nav a {
        display: inline-block;
        padding: 0.3rem 0.7rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-primary);
        text-decoration: none;
        background: transparent;
        border: 1px solid var(--color-primary);
      }

      .page-nav a:hover {
        background: var(--color-primary);
        color: #ffffff;
        text-decoration: none;
      }

      .progress {
        margin: 0 0 1rem;
        font-size: 0.95rem;
        color: var(--color-secondary);
      }

      .question {
        border: 1px solid var(--color-border);
        padding: 1rem;
        margin-top: 1rem;
        background: var(--color-bg);
      }

      .answers {
        display: grid;
        gap: 0;
        margin: 1rem 0 0;
        border: 1px solid var(--color-border);
      }

      .answers label {
        display: block;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--color-border);
        cursor: pointer;
      }

      .answers label:last-child {
        border-bottom: none;
      }

      .answers label:nth-child(even) {
        background: var(--color-row-alt);
      }

      .answers label.correct {
        background: var(--color-row-alt);
        color: var(--color-primary);
        font-weight: 600;
      }

      .answers label.wrong {
        color: var(--color-error);
        text-decoration: line-through;
      }

      .answers label.checked-mode {
        cursor: default;
      }

      .option-tag {
        display: inline-block;
        margin-left: 0.35rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-secondary);
      }

      button {
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--color-primary);
        background: transparent;
        color: var(--color-primary);
        font-weight: 600;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--color-primary);
        color: #ffffff;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1.25rem;
      }

      #reset-btn {
        margin-left: auto;
      }

      .result {
        font-weight: 600;
        margin-top: 1rem;
      }

      .ok {
        color: var(--color-primary);
      }

      .ko {
        color: var(--color-error);
      }

      .muted {
        color: var(--color-secondary);
      }

      .question-feedback {
        margin-top: 0.75rem;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .status {
        margin-top: 0.75rem;
        font-size: 0.95rem;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88em;
        background: var(--color-row-alt);
        color: var(--color-secondary);
        padding: 0.1em 0.35em;
      }

      .site-footer {
        margin-top: 2.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--color-border);
        text-align: center;
        font-size: 0.9rem;
        color: var(--color-secondary);
      }

      .site-footer a {
        color: var(--color-secondary);
        text-decoration: underline;
        font-weight: 400;
      }

      .site-footer a:hover {
        color: var(--color-primary);
      }
    </style>
  </head>
  <body>
    <h1>Quiz — Séance 1</h1>
    <nav class="page-nav">
      <a href="../../index.html">← Retour à l'accueil</a>
      <a href="cours_seance_01.html">Retour aux slides</a>
    </nav>
    <p class="muted">10 questions sur le cours de la séance 1.</p>
    <p class="progress" id="progress"></p>
    <div id="quiz"></div>

    <div class="actions">
      <button id="check-btn" type="button">Valider les réponses</button>
      <button id="reset-btn" type="button">Réinitialiser</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div id="summary" class="result" aria-live="polite"></div>

    <script>
      const storageKey = "quiz_seance_01_answers_v3";
      const checkedKey = "quiz_seance_01_checked_v3";

      const questions = [
        {
          id: "q1",
          text: "Quel opérateur sert à affecter une valeur à une variable en Python ?",
          options: [
            { value: "A", label: "<code>==</code>" },
            { value: "B", label: "<code>=</code>" },
            { value: "C", label: "<code>:=</code>" },
            { value: "D", label: "<code>!=</code>" },
          ],
          correct: "B",
          feedback: "L'opérateur d'affectation est <code>=</code>. <code>==</code> sert à comparer.",
        },
        {
          id: "q2",
          text: "Python est principalement considéré comme un langage…",
          options: [
            { value: "A", label: "compilé" },
            { value: "B", label: "interprété" },
            { value: "C", label: "assembleur" },
            { value: "D", label: "machine" },
          ],
          correct: "B",
          feedback: "Python est interprété : l'interpréteur lit et exécute les instructions à chaque lancement.",
        },
        {
          id: "q3",
          text: "En Python, une variable est surtout…",
          options: [
            { value: "A", label: "une boîte qui contient directement la valeur" },
            { value: "B", label: "un nom qui référence un objet en mémoire" },
            { value: "C", label: "un type déclaré explicitement avant usage" },
            { value: "D", label: "une fonction prédéfinie du langage" },
          ],
          correct: "B",
          feedback: "Une variable est une référence : un nom lié à un objet, pas une boîte contenant la valeur.",
        },
        {
          id: "q4",
          text: "Comment marque-t-on un commentaire sur une ligne en Python ?",
          options: [
            { value: "A", label: "avec <code>//</code>" },
            { value: "B", label: "avec <code>/* ... */</code>" },
            { value: "C", label: "avec <code>#</code>" },
            { value: "D", label: "avec <code>--</code>" },
          ],
          correct: "C",
          feedback: "Les commentaires Python commencent par <code>#</code> et sont ignorés à l'exécution.",
        },
        {
          id: "q5",
          text: "Quel est le type de la valeur <code>3.14</code> en Python ?",
          options: [
            { value: "A", label: "<code>int</code>" },
            { value: "B", label: "<code>float</code>" },
            { value: "C", label: "<code>bool</code>" },
            { value: "D", label: "<code>str</code>" },
          ],
          correct: "B",
          feedback: "<code>3.14</code> est un nombre à virgule flottante, donc de type <code>float</code>.",
        },
        {
          id: "q6",
          text: "Que renvoie l'expression <code>5 == 5</code> ?",
          options: [
            { value: "A", label: "le nombre <code>5</code>" },
            { value: "B", label: "le nombre <code>0</code>" },
            { value: "C", label: "<code>True</code>" },
            { value: "D", label: "la chaîne <code>\"5\"</code>" },
          ],
          correct: "C",
          feedback: "Une comparaison renvoie toujours un booléen. Ici, l'égalité est vraie : <code>True</code>.",
        },
        {
          id: "q7",
          text: "Quelle est la valeur de <code>True and False</code> ?",
          options: [
            { value: "A", label: "<code>True</code>" },
            { value: "B", label: "<code>False</code>" },
            { value: "C", label: "<code>None</code>" },
            { value: "D", label: "une erreur" },
          ],
          correct: "B",
          feedback: "L'opérateur <code>and</code> n'est vrai que si les deux opérandes sont vrais.",
        },
        {
          id: "q8",
          text: "À quoi sert principalement le REPL Python ?",
          options: [
            { value: "A", label: "compiler le code en binaire avant exécution" },
            { value: "B", label: "exécuter des instructions en direct pour tester du code" },
            { value: "C", label: "créer automatiquement des fichiers <code>.py</code>" },
            { value: "D", label: "installer des bibliothèques externes" },
          ],
          correct: "B",
          feedback: "Le REPL permet de lancer <code>python</code> sans fichier et de tester des instructions immédiatement.",
        },
        {
          id: "q9",
          text: "Par rapport à un éditeur de code, un IDE ajoute surtout…",
          options: [
            { value: "A", label: "uniquement la coloration syntaxique" },
            { value: "B", label: "l'exécution et le débogage au même endroit" },
            { value: "C", label: "l'obligation de déclarer les types explicitement" },
            { value: "D", label: "la conversion automatique du code en C++" },
          ],
          correct: "B",
          feedback: "Un IDE regroupe édition, exécution et débogage ; l'éditeur de code sert surtout à écrire le script.",
        },
        {
          id: "q10",
          text: "Quelle syntaxe définit correctement une f-string en Python ?",
          options: [
            { value: "A", label: "<code>\"Bonjour {nom}\"</code>" },
            { value: "B", label: "<code>f\"Bonjour {nom}\"</code>" },
            { value: "C", label: "<code>str(\"Bonjour\", nom)</code>" },
            { value: "D", label: "<code>format(\"Bonjour {nom}\")</code>" },
          ],
          correct: "B",
          feedback: "Une f-string est préfixée par <code>f</code> ; les variables s'insèrent entre accolades.",
        },
      ];

      const quizEl = document.getElementById("quiz");
      const progressEl = document.getElementById("progress");
      const statusEl = document.getElementById("status");
      const summaryEl = document.getElementById("summary");
      const checkBtn = document.getElementById("check-btn");
      const resetBtn = document.getElementById("reset-btn");

      let checked = false;
      const answers = {};

      function loadState() {
        const rawAnswers = localStorage.getItem(storageKey);
        const rawChecked = localStorage.getItem(checkedKey);

        if (rawAnswers) {
          try {
            Object.assign(answers, JSON.parse(rawAnswers));
          } catch {
            localStorage.removeItem(storageKey);
          }
        }

        checked = rawChecked === "1";
      }

      function saveState() {
        localStorage.setItem(storageKey, JSON.stringify(answers));
        localStorage.setItem(checkedKey, checked ? "1" : "0");
      }

      function answeredCount() {
        return questions.filter((question) => answers[question.id]).length;
      }

      function updateProgress() {
        progressEl.textContent = `${answeredCount()} / ${questions.length} réponse(s) cochée(s)`;
      }

      function renderQuiz() {
        quizEl.innerHTML = questions
          .map((question, index) => {
            const selected = answers[question.id] || null;
            let feedbackHtml = "";

            if (checked) {
              const isCorrect = selected === question.correct;
              const verdictClass = !selected ? "ko" : isCorrect ? "ok" : "ko";
              const verdictText = !selected
                ? "Non répondue."
                : isCorrect
                  ? `Correct. ${question.feedback}`
                  : `Incorrect. ${question.feedback}`;
              feedbackHtml = `<p class="question-feedback ${verdictClass}">${verdictText}</p>`;
            }

            const optionsHtml = question.options
              .map((option) => {
                const isCorrect = option.value === question.correct;
                const isChosen = option.value === selected;
                const classes = [];
                if (checked) classes.push("checked-mode");
                if (checked && isCorrect) classes.push("correct");
                if (checked && isChosen && !isCorrect) classes.push("wrong");

                let tag = "";
                if (checked && isCorrect) tag = '<span class="option-tag">bonne réponse</span>';
                else if (checked && isChosen) tag = '<span class="option-tag">réponse sélectionnée</span>';

                return `
                  <label class="${classes.join(" ")}">
                    <input
                      type="radio"
                      name="${question.id}"
                      value="${option.value}"
                      ${selected === option.value ? "checked" : ""}
                      ${checked ? "disabled" : ""}
                    />
                    ${option.value}. ${option.label}${tag}
                  </label>
                `;
              })
              .join("");

            return `
              <section class="question" data-question-id="${question.id}">
                <h2>Question ${index + 1}</h2>
                <p><strong>${question.text}</strong></p>
                <div class="answers">${optionsHtml}</div>
                ${feedbackHtml}
              </section>
            `;
          })
          .join("");

        if (!checked) {
          quizEl.querySelectorAll('input[type="radio"]').forEach((input) => {
            input.addEventListener("change", () => {
              answers[input.name] = input.value;
              statusEl.textContent = "";
              statusEl.className = "status";
              summaryEl.innerHTML = "";
              summaryEl.className = "result";
              saveState();
              updateProgress();
            });
          });
        }

        checkBtn.hidden = checked;
        updateProgress();

        if (checked) {
          renderSummary();
        } else {
          summaryEl.innerHTML = "";
          summaryEl.className = "result";
        }
      }

      function renderSummary() {
        let score = 0;
        questions.forEach((question) => {
          if (answers[question.id] === question.correct) score += 1;
        });

        summaryEl.innerHTML = `<p class="${score === questions.length ? "ok" : "ko"}">Score : ${score} / ${questions.length}</p>`;
        summaryEl.className = "result";
      }

      function checkAll() {
        const unanswered = questions.filter((question) => !answers[question.id]);
        if (unanswered.length > 0) {
          statusEl.textContent = `Il reste ${unanswered.length} question(s) sans réponse.`;
          statusEl.className = "status ko";
          const firstMissing = quizEl.querySelector(
            `[data-question-id="${unanswered[0].id}"]`
          );
          if (firstMissing) firstMissing.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }

        checked = true;
        statusEl.textContent = "";
        statusEl.className = "status";
        saveState();
        renderQuiz();
        summaryEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function resetQuiz() {
        for (const key of Object.keys(answers)) {
          delete answers[key];
        }
        checked = false;
        localStorage.removeItem(storageKey);
        localStorage.removeItem(checkedKey);
        statusEl.textContent = "";
        statusEl.className = "status";
        summaryEl.innerHTML = "";
        summaryEl.className = "result";
        renderQuiz();
      }

      checkBtn.addEventListener("click", checkAll);
      resetBtn.addEventListener("click", resetQuiz);

      loadState();
      renderQuiz();
    </script>

    <footer class="site-footer"><a href="mailto:shuraux@he2b.be">Sylvain Huraux - HE2B - ISIB</a></footer>
  </body>
</html>
