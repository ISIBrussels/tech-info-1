<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz — Séance 6</title>
    <style>
      :root {
        --color-primary: #0075c9;
        --color-secondary: #757575;
        --color-bg: #ffffff;
        --color-text: #212121;
        --color-border: #e0e0e0;
        --color-row-alt: #f5f5f5;
        --color-error: #f23646;
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: 920px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 3rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.65;
        color: var(--color-text);
        background: var(--color-bg);
      }

      h1 {
        margin: 0 0 1.25rem;
        font-size: 1.85rem;
        font-weight: 700;
        color: var(--color-primary);
        padding-bottom: 0.6rem;
        border-bottom: 2px solid var(--color-primary);
      }

      h2 {
        margin: 0 0 0.75rem;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--color-secondary);
      }

      a {
        color: var(--color-primary);
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        text-decoration: underline;
      }

      .page-nav {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin: 0 0 1.25rem;
      }

      .page-nav a {
        display: inline-block;
        padding: 0.3rem 0.7rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-primary);
        text-decoration: none;
        background: transparent;
        border: 1px solid var(--color-primary);
      }

      .page-nav a:hover {
        background: var(--color-primary);
        color: #ffffff;
        text-decoration: none;
      }

      .progress {
        margin: 0 0 1rem;
        font-size: 0.95rem;
        color: var(--color-secondary);
      }

      .question {
        border: 1px solid var(--color-border);
        padding: 1rem;
        margin-top: 1rem;
        background: var(--color-bg);
      }

      .answers {
        display: grid;
        gap: 0;
        margin: 1rem 0 0;
        border: 1px solid var(--color-border);
      }

      .answers label {
        display: block;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--color-border);
        cursor: pointer;
      }

      .answers label:last-child {
        border-bottom: none;
      }

      .answers label:nth-child(even) {
        background: var(--color-row-alt);
      }

      .answers label.correct {
        background: var(--color-row-alt);
        color: var(--color-primary);
        font-weight: 600;
      }

      .answers label.wrong {
        color: var(--color-error);
        text-decoration: line-through;
      }

      .answers label.checked-mode {
        cursor: default;
      }

      .option-tag {
        display: inline-block;
        margin-left: 0.35rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-secondary);
      }

      button {
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--color-primary);
        background: transparent;
        color: var(--color-primary);
        font-weight: 600;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--color-primary);
        color: #ffffff;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1.25rem;
      }

      #reset-btn {
        margin-left: auto;
      }

      .result {
        font-weight: 600;
        margin-top: 1rem;
      }

      .ok {
        color: var(--color-primary);
      }

      .ko {
        color: var(--color-error);
      }

      .muted {
        color: var(--color-secondary);
      }

      .question-feedback {
        margin-top: 0.75rem;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .status {
        margin-top: 0.75rem;
        font-size: 0.95rem;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88em;
        background: var(--color-row-alt);
        color: var(--color-secondary);
        padding: 0.1em 0.35em;
      }

      .site-footer {
        margin-top: 2.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--color-border);
        text-align: center;
        font-size: 0.9rem;
        color: var(--color-secondary);
      }

      .site-footer a {
        color: var(--color-secondary);
        text-decoration: underline;
        font-weight: 400;
      }

      .site-footer a:hover {
        color: var(--color-primary);
      }
    </style>
  </head>
  <body>
    <h1>Quiz — Séance 6</h1>
    <nav class="page-nav">
      <a href="../../index.html">← Retour à l'accueil</a>
      <a href="cours_seance_06.html">Retour aux slides</a>
    </nav>
    <p class="muted">10 questions sur le cours de la séance 6.</p>
    <p class="progress" id="progress"></p>
    <div id="quiz"></div>

    <div class="actions">
      <button id="check-btn" type="button">Valider les réponses</button>
      <button id="reset-btn" type="button">Réinitialiser</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div id="summary" class="result" aria-live="polite"></div>

    <script>
      const storageKey = "quiz_seance_06_answers_v4";
      const checkedKey = "quiz_seance_06_checked_v4";

      const questions = [
        {
          id: "q1",
          text: "Quelle propriété caractérise un <code>set</code> ?",
          options: [
            { value: "A", label: "il conserve les doublons et s'indexe" },
            { value: "B", label: "il est non ordonné, sans doublons, et n'est pas indexable" },
            { value: "C", label: "il est immuable" },
            { value: "D", label: "ses éléments sont des paires clef → valeur" },
          ],
          correct: "B",
          feedback: "Même écrit deux fois, un élément n'apparaît qu'une fois. <code>elements[i]</code> n'existe pas.",
        },
        {
          id: "q2",
          text: "Quelle différence entre <code>remove(obj)</code> et <code>discard(obj)</code> sur un <code>set</code> ?",
          options: [
            { value: "A", label: "<code>remove</code> lève une erreur si absent, <code>discard</code> non" },
            { value: "B", label: "<code>discard</code> lève une erreur si absent, <code>remove</code> non" },
            { value: "C", label: "aucune" },
            { value: "D", label: "<code>remove</code> retire un élément au hasard" },
          ],
          correct: "A",
          feedback: "<code>pop()</code> retire un élément au hasard. <code>add</code> ajoute un élément.",
        },
        {
          id: "q3",
          text: "Un <code>frozenset</code> est à un <code>set</code> ce qu'un…",
          options: [
            { value: "A", label: "<code>dict</code> est à une <code>list</code>" },
            { value: "B", label: "<code>tuple</code> est à une <code>list</code>" },
            { value: "C", label: "<code>range</code> est à un <code>int</code>" },
            { value: "D", label: "<code>str</code> est à un <code>bytes</code>" },
          ],
          correct: "B",
          feedback: "Le <code>frozenset</code> est non ordonné et immuable. On le crée avec le constructeur <code>frozenset(...)</code>.",
        },
        {
          id: "q4",
          text: "Quelle contrainte s'applique aux clefs d'un <code>dict</code> ?",
          options: [
            { value: "A", label: "elles peuvent être de n'importe quel type" },
            { value: "B", label: "elles doivent être hashables" },
            { value: "C", label: "elles doivent toujours être des <code>int</code>" },
            { value: "D", label: "elles doivent être uniques seulement si les valeurs le sont aussi" },
          ],
          correct: "B",
          feedback: "Les valeurs peuvent être de n'importe quel type. Les clefs, souvent des <code>str</code>, ne peuvent pas être des listes.",
        },
        {
          id: "q5",
          text: "Si une clef est absente, que fait <code>d[key]</code> par rapport à <code>d.get(key)</code> ?",
          options: [
            { value: "A", label: "les deux lèvent une erreur" },
            { value: "B", label: "les deux renvoient <code>None</code>" },
            { value: "C", label: "<code>d[key]</code> lève une erreur, <code>get</code> non" },
            { value: "D", label: "<code>get</code> lève une erreur, <code>d[key]</code> crée la clef" },
          ],
          correct: "C",
          feedback: "<code>get</code> permet de lire sans planter. Pour créer une paire : <code>d[\"hello\"] = 55</code>.",
        },
        {
          id: "q6",
          text: "Que fournit <code>d.items()</code> ?",
          options: [
            { value: "A", label: "uniquement les clefs" },
            { value: "B", label: "uniquement les valeurs" },
            { value: "C", label: "un itérable de tuples <code>(clef, valeur)</code>" },
            { value: "D", label: "une copie complète du dictionnaire" },
          ],
          correct: "C",
          feedback: "<code>keys()</code> donne les clefs, <code>values()</code> les valeurs, <code>items()</code> les paires.",
        },
        {
          id: "q7",
          text: "Que fait <code>setdefault(key, default)</code> ?",
          options: [
            { value: "A", label: "écrase toujours la valeur associée à <code>key</code>" },
            { value: "B", label: "ajoute la paire seulement si la clef est absente" },
            { value: "C", label: "supprime la clef si elle existe" },
            { value: "D", label: "renvoie toutes les clefs du dictionnaire" },
          ],
          correct: "B",
          feedback: "Contrairement à une affectation <code>d[key] = ...</code>, <code>setdefault</code> ne remplace pas une valeur déjà présente.",
        },
        {
          id: "q8",
          text: "Que se passe-t-il à l'exécution si un type annoté est faux ?",
          options: [
            { value: "A", label: "Python lève automatiquement une erreur" },
            { value: "B", label: "rien" },
            { value: "C", label: "le programme se convertit tout seul vers le bon type" },
            { value: "D", label: "seule la fonction <code>main</code> est refusée" },
          ],
          correct: "B",
          feedback: "Les annotations (<code>name: str</code>, <code>-&gt; str</code>) aident à la lisibilité et aux vérifications statiques, pas à l'exécution.",
        },
        {
          id: "q9",
          text: "Comment appelle-t-on en général <code>fromkeys</code> ?",
          options: [
            { value: "A", label: "sur une instance" },
            { value: "B", label: "sur la classe <code>dict</code>" },
            { value: "C", label: "uniquement dans un <code>set</code>" },
            { value: "D", label: "après <code>popitem</code> uniquement" },
          ],
          correct: "B",
          feedback: "<code>dict.fromkeys(keys, value)</code> crée un nouveau dict. <code>value</code> vaut <code>None</code> par défaut.",
        },
        {
          id: "q10",
          text: "Comment doit-on appeler <code>main()</code> à l'examen ?",
          options: [
            { value: "A", label: "n'importe où au niveau zéro du fichier" },
            { value: "B", label: "dans un <code>while True</code>" },
            { value: "C", label: "dans exactement <code>if __name__ == \"__main__\":</code>" },
            { value: "D", label: "on ne l'appelle jamais" },
          ],
          correct: "C",
          feedback: "Les définitions d'abord, le programme dans <code>main()</code>, puis l'appel dans ce <code>if</code> exact.",
        },
      ];

      const quizEl = document.getElementById("quiz");
      const progressEl = document.getElementById("progress");
      const statusEl = document.getElementById("status");
      const summaryEl = document.getElementById("summary");
      const checkBtn = document.getElementById("check-btn");
      const resetBtn = document.getElementById("reset-btn");

      let checked = false;
      const answers = {};

      function loadState() {
        const rawAnswers = localStorage.getItem(storageKey);
        const rawChecked = localStorage.getItem(checkedKey);

        if (rawAnswers) {
          try {
            Object.assign(answers, JSON.parse(rawAnswers));
          } catch {
            localStorage.removeItem(storageKey);
          }
        }

        checked = rawChecked === "1";
      }

      function saveState() {
        localStorage.setItem(storageKey, JSON.stringify(answers));
        localStorage.setItem(checkedKey, checked ? "1" : "0");
      }

      function answeredCount() {
        return questions.filter((question) => answers[question.id]).length;
      }

      function updateProgress() {
        progressEl.textContent = `${answeredCount()} / ${questions.length} réponse(s) cochée(s)`;
      }

      function renderQuiz() {
        quizEl.innerHTML = questions
          .map((question, index) => {
            const selected = answers[question.id] || null;
            let feedbackHtml = "";

            if (checked) {
              const isCorrect = selected === question.correct;
              const verdictClass = !selected ? "ko" : isCorrect ? "ok" : "ko";
              const verdictText = !selected
                ? "Non répondue."
                : isCorrect
                  ? `Correct. ${question.feedback}`
                  : `Incorrect. ${question.feedback}`;
              feedbackHtml = `<p class="question-feedback ${verdictClass}">${verdictText}</p>`;
            }

            const optionsHtml = question.options
              .map((option) => {
                const isCorrect = option.value === question.correct;
                const isChosen = option.value === selected;
                const classes = [];
                if (checked) classes.push("checked-mode");
                if (checked && isCorrect) classes.push("correct");
                if (checked && isChosen && !isCorrect) classes.push("wrong");

                let tag = "";
                if (checked && isCorrect) tag = '<span class="option-tag">bonne réponse</span>';
                else if (checked && isChosen) tag = '<span class="option-tag">réponse sélectionnée</span>';

                return `
                  <label class="${classes.join(" ")}">
                    <input
                      type="radio"
                      name="${question.id}"
                      value="${option.value}"
                      ${selected === option.value ? "checked" : ""}
                      ${checked ? "disabled" : ""}
                    />
                    ${option.value}. ${option.label}${tag}
                  </label>
                `;
              })
              .join("");

            return `
              <section class="question" data-question-id="${question.id}">
                <h2>Question ${index + 1}</h2>
                <p><strong>${question.text}</strong></p>
                <div class="answers">${optionsHtml}</div>
                ${feedbackHtml}
              </section>
            `;
          })
          .join("");

        if (!checked) {
          quizEl.querySelectorAll('input[type="radio"]').forEach((input) => {
            input.addEventListener("change", () => {
              answers[input.name] = input.value;
              statusEl.textContent = "";
              statusEl.className = "status";
              summaryEl.innerHTML = "";
              summaryEl.className = "result";
              saveState();
              updateProgress();
            });
          });
        }

        checkBtn.hidden = checked;
        updateProgress();

        if (checked) {
          renderSummary();
        } else {
          summaryEl.innerHTML = "";
          summaryEl.className = "result";
        }
      }

      function renderSummary() {
        let score = 0;
        questions.forEach((question) => {
          if (answers[question.id] === question.correct) score += 1;
        });

        summaryEl.innerHTML = `<p class="${score === questions.length ? "ok" : "ko"}">Score : ${score} / ${questions.length}</p>`;
        summaryEl.className = "result";
      }

      function checkAll() {
        const unanswered = questions.filter((question) => !answers[question.id]);
        if (unanswered.length > 0) {
          statusEl.textContent = `Il reste ${unanswered.length} question(s) sans réponse.`;
          statusEl.className = "status ko";
          const firstMissing = quizEl.querySelector(
            `[data-question-id="${unanswered[0].id}"]`
          );
          if (firstMissing) firstMissing.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }

        checked = true;
        statusEl.textContent = "";
        statusEl.className = "status";
        saveState();
        renderQuiz();
        summaryEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function resetQuiz() {
        for (const key of Object.keys(answers)) {
          delete answers[key];
        }
        checked = false;
        localStorage.removeItem(storageKey);
        localStorage.removeItem(checkedKey);
        statusEl.textContent = "";
        statusEl.className = "status";
        summaryEl.innerHTML = "";
        summaryEl.className = "result";
        renderQuiz();
      }

      checkBtn.addEventListener("click", checkAll);
      resetBtn.addEventListener("click", resetQuiz);

      loadState();
      renderQuiz();
    </script>

    <footer class="site-footer"><a href="mailto:shuraux@he2b.be">Sylvain Huraux - HE2B - ISIB</a></footer>
  </body>
</html>
