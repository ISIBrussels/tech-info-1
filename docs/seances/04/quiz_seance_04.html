<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Séance 4 — Quiz</title>
    <style>
      :root {
        --color-primary: #0075c9;
        --color-secondary: #757575;
        --color-bg: #ffffff;
        --color-text: #212121;
        --color-border: #e0e0e0;
        --color-row-alt: #f5f5f5;
        --color-error: #f23646;
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: 920px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 3rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.65;
        color: var(--color-text);
        background: var(--color-bg);
      }

      h1 {
        margin: 0 0 1.25rem;
        font-size: 1.85rem;
        font-weight: 700;
        color: var(--color-primary);
        padding-bottom: 0.6rem;
        border-bottom: 2px solid var(--color-primary);
      }

      h2 {
        margin: 0 0 0.75rem;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--color-secondary);
      }

      a {
        color: var(--color-primary);
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        text-decoration: underline;
      }

      .page-nav {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin: 0 0 1.25rem;
      }

      .page-nav a {
        display: inline-block;
        padding: 0.3rem 0.7rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-primary);
        text-decoration: none;
        background: transparent;
        border: 1px solid var(--color-primary);
      }

      .page-nav a:hover {
        background: var(--color-primary);
        color: #ffffff;
        text-decoration: none;
      }

      .progress {
        margin: 0 0 1rem;
        font-size: 0.95rem;
        color: var(--color-secondary);
      }

      .question {
        border: 1px solid var(--color-border);
        padding: 1rem;
        margin-top: 1rem;
        background: var(--color-bg);
      }

      .answers {
        display: grid;
        gap: 0;
        margin: 1rem 0 0;
        border: 1px solid var(--color-border);
      }

      .answers label {
        display: block;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--color-border);
        cursor: pointer;
      }

      .answers label:last-child {
        border-bottom: none;
      }

      .answers label:nth-child(even) {
        background: var(--color-row-alt);
      }

      .answers label.correct {
        background: var(--color-row-alt);
        color: var(--color-primary);
        font-weight: 600;
      }

      .answers label.wrong {
        color: var(--color-error);
        text-decoration: line-through;
      }

      .answers label.checked-mode {
        cursor: default;
      }

      .option-tag {
        display: inline-block;
        margin-left: 0.35rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-secondary);
      }

      button {
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--color-primary);
        background: transparent;
        color: var(--color-primary);
        font-weight: 600;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--color-primary);
        color: #ffffff;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1.25rem;
      }

      #reset-btn {
        margin-left: auto;
      }

      .result {
        font-weight: 600;
        margin-top: 1rem;
      }

      .ok {
        color: var(--color-primary);
      }

      .ko {
        color: var(--color-error);
      }

      .muted {
        color: var(--color-secondary);
      }

      .question-feedback {
        margin-top: 0.75rem;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .status {
        margin-top: 0.75rem;
        font-size: 0.95rem;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88em;
        background: var(--color-row-alt);
        color: var(--color-secondary);
        padding: 0.1em 0.35em;
      }

      .site-footer {
        margin-top: 2.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--color-border);
        text-align: center;
        font-size: 0.9rem;
        color: var(--color-secondary);
      }

      .site-footer a {
        color: var(--color-secondary);
        text-decoration: underline;
        font-weight: 400;
      }

      .site-footer a:hover {
        color: var(--color-primary);
      }
    </style>
  </head>
  <body>
    <h1>Séance 4 — Quiz</h1>
    <nav class="page-nav">
      <a href="../../index.html">← Retour à l'accueil</a>
      <a href="cours_seance_04.html">Retour aux slides</a>
    </nav>
    <p class="muted">10 questions sur le cours de la séance 4.</p>
    <p class="progress" id="progress"></p>
    <div id="quiz"></div>

    <div class="actions">
      <button id="check-btn" type="button">Valider les réponses</button>
      <button id="reset-btn" type="button">Réinitialiser</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div id="summary" class="result" aria-live="polite"></div>

    <script>
      const storageKey = "quiz_seance_04_answers_v4";
      const checkedKey = "quiz_seance_04_checked_v4";

      const questions = [
        {
          id: "q1",
          text: "En Python, une boucle <code>for</code> sert surtout à…",
          options: [
            { value: "A", label: "répéter tant qu'un compteur est inférieur à une borne" },
            { value: "B", label: "parcourir un itérable" },
            { value: "C", label: "définir une fonction" },
            { value: "D", label: "convertir un type vers un autre" },
          ],
          correct: "B",
          feedback: "Le <code>for</code> Python est un for each : la variable prend successivement les valeurs de l'itérable.",
        },
        {
          id: "q2",
          text: "Que fournit <code>enumerate(languages)</code> à chaque itération ?",
          options: [
            { value: "A", label: "uniquement l'élément" },
            { value: "B", label: "uniquement l'indice" },
            { value: "C", label: "un tuple <code>(indice, élément)</code>" },
            { value: "D", label: "une copie triée de la liste" },
          ],
          correct: "C",
          feedback: "On écrit souvent <code>for i, language in enumerate(languages)</code>. L'indice commence à 0 par défaut.",
        },
        {
          id: "q3",
          text: "Quelle est la différence entre <code>break</code> et <code>continue</code> ?",
          options: [
            { value: "A", label: "<code>break</code> sort de la boucle, <code>continue</code> passe à la suivante" },
            { value: "B", label: "<code>continue</code> sort de la boucle, <code>break</code> passe à la suivante" },
            { value: "C", label: "les deux quittent la fonction" },
            { value: "D", label: "les deux équivalent à <code>pass</code>" },
          ],
          correct: "A",
          feedback: "<code>break</code> interrompt la boucle. <code>continue</code> n'exécute pas le reste du corps et reprend à l'itération suivante.",
        },
        {
          id: "q4",
          text: "Que renvoie <code>divmod(x, y)</code> ?",
          options: [
            { value: "A", label: "uniquement le quotient" },
            { value: "B", label: "uniquement le reste" },
            { value: "C", label: "un tuple <code>(quotient, reste)</code>" },
            { value: "D", label: "la puissance <code>x ** y</code>" },
          ],
          correct: "C",
          feedback: "<code>divmod</code> combine <code>//</code> et <code>%</code>. <code>pow(x, y)</code> calcule la puissance.",
        },
        {
          id: "q5",
          text: "Quand <code>all(iterable)</code> vaut-il <code>True</code> ?",
          options: [
            { value: "A", label: "si au moins un élément est vrai" },
            { value: "B", label: "si tous les éléments sont vrais" },
            { value: "C", label: "si l'itérable est vide uniquement" },
            { value: "D", label: "si aucun élément n'est vrai" },
          ],
          correct: "B",
          feedback: "<code>all</code> exige que tous les éléments soient vrais. <code>any</code> se contente d'au moins un.",
        },
        {
          id: "q6",
          text: "Que renvoie toujours <code>sorted(...)</code> ?",
          options: [
            { value: "A", label: "le même type que l'entrée" },
            { value: "B", label: "une <code>list</code>" },
            { value: "C", label: "<code>None</code>" },
            { value: "D", label: "un <code>tuple</code>" },
          ],
          correct: "B",
          feedback: "<code>sorted</code> renvoie toujours une liste, même si l'entrée est un tuple ou un set.",
        },
        {
          id: "q7",
          text: "À quoi sert <code>zip(it1, it2)</code> ?",
          options: [
            { value: "A", label: "à compresser des fichiers" },
            { value: "B", label: "à concaténer deux listes bout à bout" },
            { value: "C", label: "à associer les éléments de même indice" },
            { value: "D", label: "à trier deux itérables en parallèle" },
          ],
          correct: "C",
          feedback: "À chaque tour, <code>zip</code> associe les éléments de même position dans les itérables.",
        },
        {
          id: "q8",
          text: "Que vaut <code>bin(4)</code> ?",
          options: [
            { value: "A", label: "<code>100</code>" },
            { value: "B", label: "<code>\"0b100\"</code>" },
            { value: "C", label: "<code>\"0x4\"</code>" },
            { value: "D", label: "<code>\"0o4\"</code>" },
          ],
          correct: "B",
          feedback: "<code>bin</code> renvoie une chaîne binaire préfixée par <code>0b</code>. <code>hex(12)</code> donne <code>\"0xC\"</code>.",
        },
        {
          id: "q9",
          text: "Quel est le rôle de <code>ord(char)</code> ?",
          options: [
            { value: "A", label: "renvoyer le caractère correspondant à un code Unicode" },
            { value: "B", label: "renvoyer le code Unicode du caractère" },
            { value: "C", label: "convertir un entier en binaire" },
            { value: "D", label: "arrondir un nombre" },
          ],
          correct: "B",
          feedback: "<code>ord</code> donne le code ; <code>chr</code> fait l'inverse (code → caractère).",
        },
        {
          id: "q10",
          text: "<code>numbers[slice(2, 8, 2)]</code> est équivalent à…",
          options: [
            { value: "A", label: "<code>numbers[2:8:2]</code>" },
            { value: "B", label: "<code>range(2, 8, 2)</code>" },
            { value: "C", label: "<code>numbers.append(2, 8, 2)</code>" },
            { value: "D", label: "<code>enumerate(numbers, 2)</code>" },
          ],
          correct: "A",
          feedback: "<code>slice(start, stop, step)</code> correspond à <code>sequence[start:stop:step]</code>. La borne <code>stop</code> est exclue.",
        },
      ];

      const quizEl = document.getElementById("quiz");
      const progressEl = document.getElementById("progress");
      const statusEl = document.getElementById("status");
      const summaryEl = document.getElementById("summary");
      const checkBtn = document.getElementById("check-btn");
      const resetBtn = document.getElementById("reset-btn");

      let checked = false;
      const answers = {};

      function loadState() {
        const rawAnswers = localStorage.getItem(storageKey);
        const rawChecked = localStorage.getItem(checkedKey);

        if (rawAnswers) {
          try {
            Object.assign(answers, JSON.parse(rawAnswers));
          } catch {
            localStorage.removeItem(storageKey);
          }
        }

        checked = rawChecked === "1";
      }

      function saveState() {
        localStorage.setItem(storageKey, JSON.stringify(answers));
        localStorage.setItem(checkedKey, checked ? "1" : "0");
      }

      function answeredCount() {
        return questions.filter((question) => answers[question.id]).length;
      }

      function updateProgress() {
        progressEl.textContent = `${answeredCount()} / ${questions.length} réponse(s) cochée(s)`;
      }

      function renderQuiz() {
        quizEl.innerHTML = questions
          .map((question, index) => {
            const selected = answers[question.id] || null;
            let feedbackHtml = "";

            if (checked) {
              const isCorrect = selected === question.correct;
              const verdictClass = !selected ? "ko" : isCorrect ? "ok" : "ko";
              const verdictText = !selected
                ? "Non répondue."
                : isCorrect
                  ? `Correct. ${question.feedback}`
                  : `Incorrect. ${question.feedback}`;
              feedbackHtml = `<p class="question-feedback ${verdictClass}">${verdictText}</p>`;
            }

            const optionsHtml = question.options
              .map((option) => {
                const isCorrect = option.value === question.correct;
                const isChosen = option.value === selected;
                const classes = [];
                if (checked) classes.push("checked-mode");
                if (checked && isCorrect) classes.push("correct");
                if (checked && isChosen && !isCorrect) classes.push("wrong");

                let tag = "";
                if (checked && isCorrect) tag = '<span class="option-tag">bonne réponse</span>';
                else if (checked && isChosen) tag = '<span class="option-tag">réponse sélectionnée</span>';

                return `
                  <label class="${classes.join(" ")}">
                    <input
                      type="radio"
                      name="${question.id}"
                      value="${option.value}"
                      ${selected === option.value ? "checked" : ""}
                      ${checked ? "disabled" : ""}
                    />
                    ${option.value}. ${option.label}${tag}
                  </label>
                `;
              })
              .join("");

            return `
              <section class="question" data-question-id="${question.id}">
                <h2>Question ${index + 1}</h2>
                <p><strong>${question.text}</strong></p>
                <div class="answers">${optionsHtml}</div>
                ${feedbackHtml}
              </section>
            `;
          })
          .join("");

        if (!checked) {
          quizEl.querySelectorAll('input[type="radio"]').forEach((input) => {
            input.addEventListener("change", () => {
              answers[input.name] = input.value;
              statusEl.textContent = "";
              statusEl.className = "status";
              summaryEl.innerHTML = "";
              summaryEl.className = "result";
              saveState();
              updateProgress();
            });
          });
        }

        checkBtn.hidden = checked;
        updateProgress();

        if (checked) {
          renderSummary();
        } else {
          summaryEl.innerHTML = "";
          summaryEl.className = "result";
        }
      }

      function renderSummary() {
        let score = 0;
        questions.forEach((question) => {
          if (answers[question.id] === question.correct) score += 1;
        });

        summaryEl.innerHTML = `<p class="${score === questions.length ? "ok" : "ko"}">Score : ${score} / ${questions.length}</p>`;
        summaryEl.className = "result";
      }

      function checkAll() {
        const unanswered = questions.filter((question) => !answers[question.id]);
        if (unanswered.length > 0) {
          statusEl.textContent = `Il reste ${unanswered.length} question(s) sans réponse.`;
          statusEl.className = "status ko";
          const firstMissing = quizEl.querySelector(
            `[data-question-id="${unanswered[0].id}"]`
          );
          if (firstMissing) firstMissing.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }

        checked = true;
        statusEl.textContent = "";
        statusEl.className = "status";
        saveState();
        renderQuiz();
        summaryEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function resetQuiz() {
        for (const key of Object.keys(answers)) {
          delete answers[key];
        }
        checked = false;
        localStorage.removeItem(storageKey);
        localStorage.removeItem(checkedKey);
        statusEl.textContent = "";
        statusEl.className = "status";
        summaryEl.innerHTML = "";
        summaryEl.className = "result";
        renderQuiz();
      }

      checkBtn.addEventListener("click", checkAll);
      resetBtn.addEventListener("click", resetQuiz);

      loadState();
      renderQuiz();
    </script>

    <footer class="site-footer"><a href="mailto:shuraux@he2b.be">Sylvain Huraux - HE2B - ISIB</a></footer>
  </body>
</html>
