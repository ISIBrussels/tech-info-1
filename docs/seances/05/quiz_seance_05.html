<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz — Séance 5</title>
    <style>
      :root {
        --color-primary: #0075c9;
        --color-secondary: #757575;
        --color-bg: #ffffff;
        --color-text: #212121;
        --color-border: #e0e0e0;
        --color-row-alt: #f5f5f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: 920px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 3rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.65;
        color: var(--color-text);
        background: var(--color-bg);
      }

      h1 {
        margin: 0 0 1.25rem;
        font-size: 1.85rem;
        font-weight: 700;
        color: var(--color-primary);
        padding-bottom: 0.6rem;
        border-bottom: 2px solid var(--color-primary);
      }

      h2 {
        margin: 0 0 0.75rem;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--color-secondary);
      }

      a {
        color: var(--color-primary);
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        text-decoration: underline;
      }

      .page-nav {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin: 0 0 1.25rem;
      }

      .page-nav a {
        display: inline-block;
        padding: 0.3rem 0.7rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-primary);
        text-decoration: none;
        background: transparent;
        border: 1px solid var(--color-primary);
      }

      .page-nav a:hover {
        background: var(--color-primary);
        color: #fff;
        text-decoration: none;
      }

      .progress {
        margin: 0 0 1rem;
        font-size: 0.95rem;
        color: var(--color-secondary);
      }

      .question {
        border: 1px solid var(--color-border);
        padding: 1rem;
        margin-top: 1rem;
        background: var(--color-bg);
      }

      .answers {
        display: grid;
        gap: 0;
        margin: 1rem 0 0;
        border: 1px solid var(--color-border);
      }

      .answers label {
        display: block;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--color-border);
        cursor: pointer;
      }

      .answers label:last-child {
        border-bottom: none;
      }

      .answers label:nth-child(even) {
        background: var(--color-row-alt);
      }

      .answers label.correct {
        background: var(--color-row-alt);
        color: var(--color-primary);
        font-weight: 600;
      }

      .answers label.wrong {
        color: var(--color-secondary);
        text-decoration: line-through;
      }

      .answers label.checked-mode {
        cursor: default;
      }

      .option-tag {
        display: inline-block;
        margin-left: 0.35rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-secondary);
      }

      button {
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--color-primary);
        background: transparent;
        color: var(--color-primary);
        font-weight: 600;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--color-primary);
        color: #fff;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1.25rem;
      }

      #reset-btn {
        margin-left: auto;
      }

      .result {
        font-weight: 600;
        margin-top: 1rem;
      }

      .ok {
        color: var(--color-primary);
      }

      .ko {
        color: var(--color-secondary);
      }

      .muted {
        color: var(--color-secondary);
      }

      .question-feedback {
        margin-top: 0.75rem;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .status {
        margin-top: 0.75rem;
        font-size: 0.95rem;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88em;
        background: var(--color-row-alt);
        color: var(--color-secondary);
        padding: 0.1em 0.35em;
      }

      .site-footer {
        margin-top: 2.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--color-border);
        text-align: center;
        font-size: 0.9rem;
        color: var(--color-secondary);
      }

      .site-footer a {
        color: var(--color-secondary);
        text-decoration: underline;
        font-weight: 400;
      }

      .site-footer a:hover {
        color: var(--color-primary);
      }
    </style>
  </head>
  <body>
    <h1>Quiz — Séance 5</h1>
    <nav class="page-nav">
      <a href="../../index.html">← Retour à l'accueil</a>
      <a href="cours_seance_05.html">Retour aux slides</a>
    </nav>
    <p class="muted">10 questions sur le cours de la séance 5.</p>
    <p class="progress" id="progress"></p>
    <div id="quiz"></div>

    <div class="actions">
      <button id="check-btn" type="button">Valider les réponses</button>
      <button id="reset-btn" type="button">Réinitialiser</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div id="summary" class="result" aria-live="polite"></div>

    <script>
      const storageKey = "quiz_seance_05_answers_v4";
      const checkedKey = "quiz_seance_05_checked_v4";

      const questions = [
        {
          id: "q1",
          text: "Quelle syntaxe appelle une méthode d'instance ?",
          options: [
            { value: "A", label: "<code>upper(sentence)</code>" },
            { value: "B", label: "<code>sentence.upper()</code>" },
            { value: "C", label: "<code>str.upper = sentence</code>" },
            { value: "D", label: "<code>call(upper, sentence)</code>" },
          ],
          correct: "B",
          feedback: "Une méthode s'écrit <code>objet.methode()</code>. Une fonction s'écrit <code>fonction(objet)</code>.",
        },
        {
          id: "q2",
          text: "Pourquoi <code>sentence.upper()</code> ne change-t-il pas <code>sentence</code> tout seul ?",
          options: [
            { value: "A", label: "parce qu'un <code>str</code> est immuable : la méthode renvoie une nouvelle chaîne" },
            { value: "B", label: "parce que <code>upper</code> ne fonctionne que sur les listes" },
            { value: "C", label: "parce qu'il faut d'abord appeler <code>strip</code>" },
            { value: "D", label: "parce que Python refuse de changer la casse" },
          ],
          correct: "A",
          feedback: "Les méthodes de <code>str</code> renvoient une nouvelle chaîne. Il faut l'affecter si on veut garder le résultat.",
        },
        {
          id: "q3",
          text: "Que fait <code>\" \".join([\"these\", \"are\", \"words\"])</code> ?",
          options: [
            { value: "A", label: "découpe la chaîne en liste de mots" },
            { value: "B", label: "concatène les mots en les séparant par un espace" },
            { value: "C", label: "ajoute un espace au début de chaque mot, sans les coller" },
            { value: "D", label: "lève une erreur, <code>join</code> n'existe que sur les listes" },
          ],
          correct: "B",
          feedback: "<code>join</code> s'appelle sur le séparateur, et assemble les éléments de l'itérable.",
        },
        {
          id: "q4",
          text: "Quelle différence entre <code>find</code> et <code>index</code> sur une chaîne ?",
          options: [
            { value: "A", label: "<code>find</code> renvoie <code>-1</code> si absent ; <code>index</code> lève une exception" },
            { value: "B", label: "<code>index</code> renvoie <code>-1</code> ; <code>find</code> lève une exception" },
            { value: "C", label: "aucune : les deux lèvent toujours une exception" },
            { value: "D", label: "<code>find</code> cherche depuis la fin, <code>index</code> depuis le début" },
          ],
          correct: "A",
          feedback: "Les deux cherchent la première occurrence. <code>rfind</code> / <code>rindex</code> cherchent la dernière.",
        },
        {
          id: "q5",
          text: "Que renvoie <code>split</code> sur une chaîne ?",
          options: [
            { value: "A", label: "un <code>tuple</code> de 3 éléments" },
            { value: "B", label: "une <code>list</code> de morceaux" },
            { value: "C", label: "un <code>int</code> (le nombre de séparateurs)" },
            { value: "D", label: "<code>None</code>, la chaîne est modifiée en place" },
          ],
          correct: "B",
          feedback: "<code>split</code> / <code>rsplit</code> découpent et renvoient une liste. <code>partition</code> renvoie un tuple de 3.",
        },
        {
          id: "q6",
          text: "Quelle différence entre <code>append(obj)</code> et <code>extend(iterable)</code> ?",
          options: [
            { value: "A", label: "<code>append</code> ajoute un seul objet ; <code>extend</code> ajoute chaque élément de l'itérable" },
            { value: "B", label: "<code>extend</code> ajoute un seul objet ; <code>append</code> concatène" },
            { value: "C", label: "aucune, ce sont des alias" },
            { value: "D", label: "<code>append</code> n'existe que sur les tuples" },
          ],
          correct: "A",
          feedback: "<code>insert(index, obj)</code> insère à un indice donné, toujours un seul objet.",
        },
        {
          id: "q7",
          text: "Que fait <code>pop()</code> sans argument sur une liste ?",
          options: [
            { value: "A", label: "vide toute la liste" },
            { value: "B", label: "retire et renvoie le dernier élément" },
            { value: "C", label: "retire la première occurrence de <code>None</code>" },
            { value: "D", label: "trie la liste puis retire le minimum" },
          ],
          correct: "B",
          feedback: "Sans argument, <code>pop</code> enlève le dernier. Avec un indice, il enlève l'élément à cet indice.",
        },
        {
          id: "q8",
          text: "Quelle différence entre <code>liste.sort()</code> et <code>sorted(liste)</code> ?",
          options: [
            { value: "A", label: "aucune : les deux renvoient une nouvelle liste" },
            { value: "B", label: "<code>sort</code> modifie la liste en place ; <code>sorted</code> renvoie une nouvelle liste" },
            { value: "C", label: "<code>sorted</code> trie en place ; <code>sort</code> renvoie une copie" },
            { value: "D", label: "<code>sort</code> n'existe que pour les tuples" },
          ],
          correct: "B",
          feedback: "Même idée pour <code>reverse()</code> (en place) versus la fonction <code>reversed</code>.",
        },
        {
          id: "q9",
          text: "Quelles méthodes un <code>tuple</code> possède-t-il principalement ?",
          options: [
            { value: "A", label: "<code>append</code> et <code>sort</code>" },
            { value: "B", label: "<code>reverse</code> et <code>clear</code>" },
            { value: "C", label: "<code>count</code> et <code>index</code>" },
            { value: "D", label: "<code>copy</code> et <code>insert</code>" },
          ],
          correct: "C",
          feedback: "Le tuple est immuable : pas d'<code>append</code>, <code>sort</code> ni <code>reverse</code>. <code>copy()</code> est réservé à la liste.",
        },
        {
          id: "q10",
          text: "Quelle affirmation est vraie à propos de <code>isdigit</code> ?",
          options: [
            { value: "A", label: "les caractères <code>-</code> et <code>.</code> comptent comme des digits" },
            { value: "B", label: "<code>isdigit</code> accepte des chiffres au-delà de 0–9 (par exemple <code>²</code>)" },
            { value: "C", label: "<code>isdigit</code> et <code>isnumeric</code> sont strictement identiques" },
            { value: "D", label: "<code>isdigit</code> ne fonctionne que sur les listes" },
          ],
          correct: "B",
          feedback: "<code>-</code> et <code>.</code> ne sont pas des digits. <code>isnumeric</code> est encore plus large (fractions comme <code>¾</code>).",
        },
      ];

      const quizEl = document.getElementById("quiz");
      const progressEl = document.getElementById("progress");
      const statusEl = document.getElementById("status");
      const summaryEl = document.getElementById("summary");
      const checkBtn = document.getElementById("check-btn");
      const resetBtn = document.getElementById("reset-btn");

      let checked = false;
      const answers = {};

      function loadState() {
        const rawAnswers = localStorage.getItem(storageKey);
        const rawChecked = localStorage.getItem(checkedKey);

        if (rawAnswers) {
          try {
            Object.assign(answers, JSON.parse(rawAnswers));
          } catch {
            localStorage.removeItem(storageKey);
          }
        }

        checked = rawChecked === "1";
      }

      function saveState() {
        localStorage.setItem(storageKey, JSON.stringify(answers));
        localStorage.setItem(checkedKey, checked ? "1" : "0");
      }

      function answeredCount() {
        return questions.filter((question) => answers[question.id]).length;
      }

      function updateProgress() {
        progressEl.textContent = `${answeredCount()} / ${questions.length} réponse(s) cochée(s)`;
      }

      function renderQuiz() {
        quizEl.innerHTML = questions
          .map((question, index) => {
            const selected = answers[question.id] || null;
            let feedbackHtml = "";

            if (checked) {
              const isCorrect = selected === question.correct;
              const verdictClass = !selected ? "ko" : isCorrect ? "ok" : "ko";
              const verdictText = !selected
                ? "Non répondue."
                : isCorrect
                  ? `Correct. ${question.feedback}`
                  : `Incorrect. ${question.feedback}`;
              feedbackHtml = `<p class="question-feedback ${verdictClass}">${verdictText}</p>`;
            }

            const optionsHtml = question.options
              .map((option) => {
                const isCorrect = option.value === question.correct;
                const isChosen = option.value === selected;
                const classes = [];
                if (checked) classes.push("checked-mode");
                if (checked && isCorrect) classes.push("correct");
                if (checked && isChosen && !isCorrect) classes.push("wrong");

                let tag = "";
                if (checked && isCorrect) tag = '<span class="option-tag">bonne réponse</span>';
                else if (checked && isChosen) tag = '<span class="option-tag">réponse sélectionnée</span>';

                return `
                  <label class="${classes.join(" ")}">
                    <input
                      type="radio"
                      name="${question.id}"
                      value="${option.value}"
                      ${selected === option.value ? "checked" : ""}
                      ${checked ? "disabled" : ""}
                    />
                    ${option.value}. ${option.label}${tag}
                  </label>
                `;
              })
              .join("");

            return `
              <section class="question" data-question-id="${question.id}">
                <h2>Question ${index + 1}</h2>
                <p><strong>${question.text}</strong></p>
                <div class="answers">${optionsHtml}</div>
                ${feedbackHtml}
              </section>
            `;
          })
          .join("");

        if (!checked) {
          quizEl.querySelectorAll('input[type="radio"]').forEach((input) => {
            input.addEventListener("change", () => {
              answers[input.name] = input.value;
              statusEl.textContent = "";
              statusEl.className = "status";
              summaryEl.innerHTML = "";
              summaryEl.className = "result";
              saveState();
              updateProgress();
            });
          });
        }

        checkBtn.hidden = checked;
        updateProgress();

        if (checked) {
          renderSummary();
        } else {
          summaryEl.innerHTML = "";
          summaryEl.className = "result";
        }
      }

      function renderSummary() {
        let score = 0;
        questions.forEach((question) => {
          if (answers[question.id] === question.correct) score += 1;
        });

        summaryEl.innerHTML = `<p class="${score === questions.length ? "ok" : "ko"}">Score : ${score} / ${questions.length}</p>`;
        summaryEl.className = "result";
      }

      function checkAll() {
        const unanswered = questions.filter((question) => !answers[question.id]);
        if (unanswered.length > 0) {
          statusEl.textContent = `Il reste ${unanswered.length} question(s) sans réponse.`;
          statusEl.className = "status ko";
          const firstMissing = quizEl.querySelector(
            `[data-question-id="${unanswered[0].id}"]`
          );
          if (firstMissing) firstMissing.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }

        checked = true;
        statusEl.textContent = "";
        statusEl.className = "status";
        saveState();
        renderQuiz();
        summaryEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function resetQuiz() {
        for (const key of Object.keys(answers)) {
          delete answers[key];
        }
        checked = false;
        localStorage.removeItem(storageKey);
        localStorage.removeItem(checkedKey);
        statusEl.textContent = "";
        statusEl.className = "status";
        summaryEl.innerHTML = "";
        summaryEl.className = "result";
        renderQuiz();
      }

      checkBtn.addEventListener("click", checkAll);
      resetBtn.addEventListener("click", resetQuiz);

      loadState();
      renderQuiz();
    </script>

    <footer class="site-footer"><a href="mailto:shuraux@he2b.be">Sylvain Huraux - HE2B - ISIB</a></footer>
  </body>
</html>
