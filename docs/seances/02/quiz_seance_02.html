<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz — Séance 2</title>
    <style>
      :root {
        --color-primary: #0075c9;
        --color-secondary: #757575;
        --color-bg: #ffffff;
        --color-text: #212121;
        --color-border: #e0e0e0;
        --color-row-alt: #f5f5f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: 920px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 3rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.65;
        color: var(--color-text);
        background: var(--color-bg);
      }

      h1 {
        margin: 0 0 1.25rem;
        font-size: 1.85rem;
        font-weight: 700;
        color: var(--color-primary);
        padding-bottom: 0.6rem;
        border-bottom: 2px solid var(--color-primary);
      }

      h2 {
        margin: 0 0 0.75rem;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--color-secondary);
      }

      a {
        color: var(--color-primary);
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        text-decoration: underline;
      }

      .page-nav {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin: 0 0 1.25rem;
      }

      .page-nav a {
        display: inline-block;
        padding: 0.3rem 0.7rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-primary);
        text-decoration: none;
        background: transparent;
        border: 1px solid var(--color-primary);
      }

      .page-nav a:hover {
        background: var(--color-primary);
        color: #fff;
        text-decoration: none;
      }

      .progress {
        margin: 0 0 1rem;
        font-size: 0.95rem;
        color: var(--color-secondary);
      }

      .question {
        border: 1px solid var(--color-border);
        padding: 1rem;
        margin-top: 1rem;
        background: var(--color-bg);
      }

      .answers {
        display: grid;
        gap: 0;
        margin: 1rem 0 0;
        border: 1px solid var(--color-border);
      }

      .answers label {
        display: block;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--color-border);
        cursor: pointer;
      }

      .answers label:last-child {
        border-bottom: none;
      }

      .answers label:nth-child(even) {
        background: var(--color-row-alt);
      }

      .answers label.correct {
        background: var(--color-row-alt);
        color: var(--color-primary);
        font-weight: 600;
      }

      .answers label.wrong {
        color: var(--color-secondary);
        text-decoration: line-through;
      }

      .answers label.checked-mode {
        cursor: default;
      }

      .option-tag {
        display: inline-block;
        margin-left: 0.35rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-secondary);
      }

      button {
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--color-primary);
        background: transparent;
        color: var(--color-primary);
        font-weight: 600;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--color-primary);
        color: #fff;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1.25rem;
      }

      #reset-btn {
        margin-left: auto;
      }

      .result {
        font-weight: 600;
        margin-top: 1rem;
      }

      .ok {
        color: var(--color-primary);
      }

      .ko {
        color: var(--color-secondary);
      }

      .muted {
        color: var(--color-secondary);
      }

      .question-feedback {
        margin-top: 0.75rem;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .status {
        margin-top: 0.75rem;
        font-size: 0.95rem;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88em;
        background: var(--color-row-alt);
        color: var(--color-secondary);
        padding: 0.1em 0.35em;
      }

      .site-footer {
        margin-top: 2.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--color-border);
        text-align: center;
        font-size: 0.9rem;
        color: var(--color-secondary);
      }

      .site-footer a {
        color: var(--color-secondary);
        text-decoration: underline;
        font-weight: 400;
      }

      .site-footer a:hover {
        color: var(--color-primary);
      }
    </style>
  </head>
  <body>
    <h1>Quiz — Séance 2</h1>
    <nav class="page-nav">
      <a href="../../index.html">← Retour à l'accueil</a>
      <a href="cours_seance_02.html">Retour aux slides</a>
    </nav>
    <p class="muted">10 questions sur le cours de la séance 2.</p>
    <p class="progress" id="progress"></p>
    <div id="quiz"></div>

    <div class="actions">
      <button id="check-btn" type="button">Valider les réponses</button>
      <button id="reset-btn" type="button">Réinitialiser</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div id="summary" class="result" aria-live="polite"></div>

    <script>
      const storageKey = "quiz_seance_02_answers_v4";
      const checkedKey = "quiz_seance_02_checked_v4";

      const questions = [
        {
          id: "q1",
          text: "Que renvoient <code>str()</code>, <code>int()</code> et <code>float()</code> ?",
          options: [
            { value: "A", label: "rien : elles modifient l'objet original" },
            { value: "B", label: "un nouvel objet du type demandé" },
            { value: "C", label: "toujours une chaîne de caractères" },
            { value: "D", label: "le type de l'objet, comme <code>type()</code>" },
          ],
          correct: "B",
          feedback: "Ces fonctions renvoient un nouvel objet. On les place à droite du <code>=</code>.",
        },
        {
          id: "q2",
          text: "Que vaut <code>bool(-2)</code> ?",
          options: [
            { value: "A", label: "<code>False</code>, car le nombre est négatif" },
            { value: "B", label: "<code>None</code>" },
            { value: "C", label: "<code>True</code>" },
            { value: "D", label: "une erreur, car <code>bool()</code> n'accepte que 0 et 1" },
          ],
          correct: "C",
          feedback: "Tout nombre sauf 0 (y compris les négatifs) se convertit en <code>True</code>.",
        },
        {
          id: "q3",
          text: "Parmi ces conversions, laquelle vaut <code>False</code> ?",
          options: [
            { value: "A", label: "<code>bool(\"Hi\")</code>" },
            { value: "B", label: "<code>bool(\" \")</code>" },
            { value: "C", label: "<code>bool(0.5)</code>" },
            { value: "D", label: "<code>bool(\"\")</code>" },
          ],
          correct: "D",
          feedback: "Seule la chaîne vide vaut <code>False</code>. Un espace est un caractère, donc <code>True</code>.",
        },
        {
          id: "q4",
          text: "Une fonction Python sans instruction <code>return</code> renvoie…",
          options: [
            { value: "A", label: "<code>None</code>" },
            { value: "B", label: "<code>False</code>" },
            { value: "C", label: "une chaîne vide" },
            { value: "D", label: "une erreur à l'appel" },
          ],
          correct: "A",
          feedback: "Si une fonction « ne renvoie rien », elle renvoie en pratique <code>None</code>.",
        },
        {
          id: "q5",
          text: "Dans <code>def add_two_numbers(a, b)</code> appelé par <code>add_two_numbers(2, 4)</code>, que sont <code>a</code> et <code>b</code> ?",
          options: [
            { value: "A", label: "des arguments" },
            { value: "B", label: "des paramètres" },
            { value: "C", label: "des constantes" },
            { value: "D", label: "des variables globales" },
          ],
          correct: "B",
          feedback: "Les paramètres sont les noms à la définition (<code>a</code>, <code>b</code>). Les arguments sont les objets passés à l'appel (<code>2</code>, <code>4</code>).",
        },
        {
          id: "q6",
          text: "Avec <code>def power(x, y=2)</code>, que vaut <code>power(y=3, x=4)</code> ?",
          options: [
            { value: "A", label: "<code>9</code> (car <code>y</code> vient en premier)" },
            { value: "B", label: "une erreur, l'ordre des arguments est obligatoire" },
            { value: "C", label: "<code>64</code> (soit <code>4 ** 3</code>)" },
            { value: "D", label: "<code>16</code> (le défaut <code>y=2</code> n'est jamais écrasé)" },
          ],
          correct: "C",
          feedback: "Les arguments nommés libèrent l'ordre : <code>x=4</code> et <code>y=3</code>, donc <code>4 ** 3 = 64</code>.",
        },
        {
          id: "q7",
          text: "Une variable déclarée à l'intérieur d'une fonction…",
          options: [
            { value: "A", label: "reste accessible partout après l'appel" },
            { value: "B", label: "n'existe que pendant l'appel, puis est supprimée" },
            { value: "C", label: "est forcément une constante" },
            { value: "D", label: "doit être déclarée avec <code>global</code>" },
          ],
          correct: "B",
          feedback: "C'est une variable locale : elle n'existe que pendant l'appel.",
        },
        {
          id: "q8",
          text: "À quoi sert l'instruction <code>pass</code> ?",
          options: [
            { value: "A", label: "à quitter immédiatement une fonction" },
            { value: "B", label: "à ignorer une exception" },
            { value: "C", label: "à ne rien faire, pour qu'un bloc ne soit pas vide" },
            { value: "D", label: "à passer des arguments par nom" },
          ],
          correct: "C",
          feedback: "Un bloc Python ne peut pas être vide. <code>pass</code> ne fait rien et permet de réserver une fonction pour plus tard.",
        },
        {
          id: "q9",
          text: "En Python, une constante…",
          options: [
            { value: "A", label: "est déclarée avec le mot-clé <code>const</code>" },
            { value: "B", label: "ne peut jamais être réaffectée, sous peine d'erreur" },
            { value: "C", label: "n'existe pas vraiment : on utilise une convention en MAJUSCULES" },
            { value: "D", label: "doit être définie uniquement dans une fonction" },
          ],
          correct: "C",
          feedback: "Aucun mot-clé n'empêche la réaffectation. La convention est un nom en majuscules (<code>DAYS_OF_WEEK</code>).",
        },
        {
          id: "q10",
          text: "Avec <code>c = 20</code>, que se passe-t-il si on écrit <code>if c &gt; 10:</code> puis <code>elif c &gt; 5:</code> ?",
          options: [
            { value: "A", label: "les deux blocs s'exécutent" },
            { value: "B", label: "seul le bloc du <code>if</code> s'exécute" },
            { value: "C", label: "seul le bloc du <code>elif</code> s'exécute" },
            { value: "D", label: "une erreur, car les deux conditions sont vraies" },
          ],
          correct: "B",
          feedback: "Si la première condition est vraie, les suivantes ne sont pas évaluées. Deux <code>if</code> indépendants pourraient tous deux s'exécuter.",
        },
      ];

      const quizEl = document.getElementById("quiz");
      const progressEl = document.getElementById("progress");
      const statusEl = document.getElementById("status");
      const summaryEl = document.getElementById("summary");
      const checkBtn = document.getElementById("check-btn");
      const resetBtn = document.getElementById("reset-btn");

      let checked = false;
      const answers = {};

      function loadState() {
        const rawAnswers = localStorage.getItem(storageKey);
        const rawChecked = localStorage.getItem(checkedKey);

        if (rawAnswers) {
          try {
            Object.assign(answers, JSON.parse(rawAnswers));
          } catch {
            localStorage.removeItem(storageKey);
          }
        }

        checked = rawChecked === "1";
      }

      function saveState() {
        localStorage.setItem(storageKey, JSON.stringify(answers));
        localStorage.setItem(checkedKey, checked ? "1" : "0");
      }

      function answeredCount() {
        return questions.filter((question) => answers[question.id]).length;
      }

      function updateProgress() {
        progressEl.textContent = `${answeredCount()} / ${questions.length} réponse(s) cochée(s)`;
      }

      function renderQuiz() {
        quizEl.innerHTML = questions
          .map((question, index) => {
            const selected = answers[question.id] || null;
            let feedbackHtml = "";

            if (checked) {
              const isCorrect = selected === question.correct;
              const verdictClass = !selected ? "ko" : isCorrect ? "ok" : "ko";
              const verdictText = !selected
                ? "Non répondue."
                : isCorrect
                  ? `Correct. ${question.feedback}`
                  : `Incorrect. ${question.feedback}`;
              feedbackHtml = `<p class="question-feedback ${verdictClass}">${verdictText}</p>`;
            }

            const optionsHtml = question.options
              .map((option) => {
                const isCorrect = option.value === question.correct;
                const isChosen = option.value === selected;
                const classes = [];
                if (checked) classes.push("checked-mode");
                if (checked && isCorrect) classes.push("correct");
                if (checked && isChosen && !isCorrect) classes.push("wrong");

                let tag = "";
                if (checked && isCorrect) tag = '<span class="option-tag">bonne réponse</span>';
                else if (checked && isChosen) tag = '<span class="option-tag">réponse sélectionnée</span>';

                return `
                  <label class="${classes.join(" ")}">
                    <input
                      type="radio"
                      name="${question.id}"
                      value="${option.value}"
                      ${selected === option.value ? "checked" : ""}
                      ${checked ? "disabled" : ""}
                    />
                    ${option.value}. ${option.label}${tag}
                  </label>
                `;
              })
              .join("");

            return `
              <section class="question" data-question-id="${question.id}">
                <h2>Question ${index + 1}</h2>
                <p><strong>${question.text}</strong></p>
                <div class="answers">${optionsHtml}</div>
                ${feedbackHtml}
              </section>
            `;
          })
          .join("");

        if (!checked) {
          quizEl.querySelectorAll('input[type="radio"]').forEach((input) => {
            input.addEventListener("change", () => {
              answers[input.name] = input.value;
              statusEl.textContent = "";
              statusEl.className = "status";
              summaryEl.innerHTML = "";
              summaryEl.className = "result";
              saveState();
              updateProgress();
            });
          });
        }

        checkBtn.hidden = checked;
        updateProgress();

        if (checked) {
          renderSummary();
        } else {
          summaryEl.innerHTML = "";
          summaryEl.className = "result";
        }
      }

      function renderSummary() {
        let score = 0;
        questions.forEach((question) => {
          if (answers[question.id] === question.correct) score += 1;
        });

        summaryEl.innerHTML = `<p class="${score === questions.length ? "ok" : "ko"}">Score : ${score} / ${questions.length}</p>`;
        summaryEl.className = "result";
      }

      function checkAll() {
        const unanswered = questions.filter((question) => !answers[question.id]);
        if (unanswered.length > 0) {
          statusEl.textContent = `Il reste ${unanswered.length} question(s) sans réponse.`;
          statusEl.className = "status ko";
          const firstMissing = quizEl.querySelector(
            `[data-question-id="${unanswered[0].id}"]`
          );
          if (firstMissing) firstMissing.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }

        checked = true;
        statusEl.textContent = "";
        statusEl.className = "status";
        saveState();
        renderQuiz();
        summaryEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function resetQuiz() {
        for (const key of Object.keys(answers)) {
          delete answers[key];
        }
        checked = false;
        localStorage.removeItem(storageKey);
        localStorage.removeItem(checkedKey);
        statusEl.textContent = "";
        statusEl.className = "status";
        summaryEl.innerHTML = "";
        summaryEl.className = "result";
        renderQuiz();
      }

      checkBtn.addEventListener("click", checkAll);
      resetBtn.addEventListener("click", resetQuiz);

      loadState();
      renderQuiz();
    </script>

    <footer class="site-footer"><a href="mailto:shuraux@he2b.be">Sylvain Huraux - HE2B - ISIB</a></footer>
  </body>
</html>
