name: Build and Deploy Marp Slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli marked

      - name: Build Marp slides
        run: |
          mkdir -p dist
          cp -r docs/* dist/

          for file in docs/seances/*/cours_seance_*.md; do
            if [ -f "$file" ]; then
              out="dist/${file#docs/}"
              out="${out%.md}.html"
              mkdir -p "$(dirname "$out")"
              marp "$file" --html -o "$out"
            fi
          done

      - name: Build exercise pages (Markdown to static HTML)
        run: |
          for file in docs/seances/*/exercices_seance_*.md; do
            if [ -f "$file" ]; then
              out="dist/${file#docs/}"
              out="${out%.md}.html"
              mkdir -p "$(dirname "$out")"

              body="$(marked "$file")"
              cat > "$out" <<EOF
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>$(basename "${file%.md}")</title>
              <style>
                body {
                  max-width: 860px;
                  margin: 2rem auto;
                  padding: 0 1rem;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                  line-height: 1.6;
                }
                pre {
                  background: #f6f8fa;
                  padding: 0.75rem;
                  overflow-x: auto;
                }
                code {
                  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                }
              </style>
            </head>
            <body>
          $body
            </body>
          </html>
          EOF
            fi
          done

      - name: Build landing page from docs/index.md
        run: |
          sed -E \
            -e 's#(seances/[0-9]{2}/cours_seance_[0-9]{2})\.md#\1.html#g' \
            -e 's#(seances/[0-9]{2}/exercices_seance_[0-9]{2})\.md#\1.html#g' \
            docs/index.md > /tmp/pages-index.md

          body="$(marked /tmp/pages-index.md)"

          cat > dist/index.html <<EOF
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Techniques Informatiques 1 — ISIB</title>
              <style>
                :root {
                  --color-bg: #f4f6fb;
                  --color-surface: #ffffff;
                  --color-primary: #1e3a5f;
                  --color-primary-light: #2d5a8e;
                  --color-accent: #c8102e;
                  --color-text: #1a2332;
                  --color-muted: #5a6478;
                  --color-border: #dde3ee;
                  --color-row-alt: #f0f4fa;
                  --color-link-bg: #e8eef8;
                  --color-link-hover: #1e3a5f;
                  --radius: 10px;
                  --shadow: 0 4px 20px rgba(30, 58, 95, 0.1);
                }

                * {
                  box-sizing: border-box;
                }

                body {
                  max-width: 920px;
                  margin: 0 auto;
                  padding: 2.5rem 1.5rem 3rem;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                  line-height: 1.65;
                  color: var(--color-text);
                  background: var(--color-bg);
                }

                h1 {
                  margin: 0 0 1.25rem;
                  font-size: 1.85rem;
                  font-weight: 700;
                  color: var(--color-primary);
                  letter-spacing: -0.02em;
                  padding-bottom: 0.75rem;
                  border-bottom: 3px solid var(--color-accent);
                }

                h2 {
                  margin: 2.25rem 0 1rem;
                  font-size: 1.2rem;
                  font-weight: 600;
                  color: var(--color-primary);
                }

                p {
                  margin: 0 0 1rem;
                  color: var(--color-text);
                }

                ul {
                  margin: 0 0 1.5rem;
                  padding-left: 1.4rem;
                  color: var(--color-muted);
                }

                li + li {
                  margin-top: 0.35rem;
                }

                table {
                  width: 100%;
                  border-collapse: separate;
                  border-spacing: 0;
                  margin-top: 0.5rem;
                  background: var(--color-surface);
                  border: 1px solid var(--color-border);
                  border-radius: var(--radius);
                  box-shadow: var(--shadow);
                  overflow: hidden;
                }

                thead th {
                  background: linear-gradient(180deg, var(--color-primary-light) 0%, var(--color-primary) 100%);
                  color: #fff;
                  font-weight: 600;
                  font-size: 0.9rem;
                  text-transform: uppercase;
                  letter-spacing: 0.04em;
                  padding: 0.9rem 1rem;
                  border-bottom: 2px solid var(--color-accent);
                }

                thead th:first-child {
                  border-radius: var(--radius) 0 0 0;
                }

                thead th:last-child {
                  border-radius: 0 var(--radius) 0 0;
                }

                tbody td {
                  padding: 0.85rem 1rem;
                  border-bottom: 1px solid var(--color-border);
                  vertical-align: middle;
                }

                tbody tr:last-child td {
                  border-bottom: none;
                }

                tbody tr:nth-child(even) {
                  background: var(--color-row-alt);
                }

                tbody tr:hover td {
                  background: #e4ecf7;
                }

                tbody td:first-child {
                  font-weight: 700;
                  color: var(--color-primary);
                  text-align: center;
                  width: 4.5rem;
                }

                tbody td:nth-child(2) {
                  font-size: 0.95rem;
                }

                tbody td:nth-child(n+3) {
                  text-align: center;
                  width: 7rem;
                }

                table a {
                  display: inline-block;
                  padding: 0.35rem 0.7rem;
                  font-size: 0.85rem;
                  font-weight: 600;
                  color: var(--color-primary);
                  text-decoration: none;
                  background: var(--color-link-bg);
                  border: 1px solid var(--color-border);
                  border-radius: 6px;
                  transition: background 0.15s, color 0.15s, border-color 0.15s;
                }

                table a:hover {
                  background: var(--color-link-hover);
                  color: #fff;
                  border-color: var(--color-link-hover);
                }

                code {
                  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                  font-size: 0.88em;
                  background: #eef1f6;
                  padding: 0.1em 0.35em;
                  border-radius: 4px;
                }

                pre {
                  background: #f6f8fa;
                  padding: 0.75rem;
                  overflow-x: auto;
                }
              </style>
            </head>
            <body>
          $body
            </body>
          </html>
          EOF

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
